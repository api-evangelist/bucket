aid: bucket
name: Bucket
description: >-
  Bucket (rebranded to Reflag in 2026, reflag.com) is a TypeScript-first feature
  management platform built for B2B SaaS teams. It provides feature flags with
  self-cleaning lifecycle automation, AI/agent integration via a hosted MCP
  server, strongly typed SDKs for React, React Native, Vue, Next.js, Node.js and
  the browser, OpenFeature providers, local flag evaluation for zero-latency and
  downtime protection, feature entitlements, in-app feedback collection, and
  deep integrations with Linear, Slack, GitHub, Datadog, Vercel and analytics
  tools. The platform exposes two APIs — a Runtime API for evaluating flags for
  users and companies at request time, and a Management API for programmatically
  managing apps, environments, flags and targeting rules from CI/CD. Backed by
  500 Global and Creandum.
